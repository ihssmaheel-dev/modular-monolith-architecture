name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.0.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/shared build
      - run: pnpm rules:check
      - run: pnpm format:check
      - run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
          MONGO_INITDB_DATABASE: app
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/shared build
      - run: pnpm --filter @repo/email build
      - run: pnpm test:unit
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://admin:password@localhost:27017/app-test?authSource=admin
          TEST_MONGODB_URI: mongodb://admin:password@localhost:27017/app-test?authSource=admin
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-with-at-least-32-characters
          JWT_REFRESH_SECRET: test-refresh-secret-with-at-least-32-characters
      - run: pnpm test:integration
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://admin:password@localhost:27017/app-test?authSource=admin
          TEST_MONGODB_URI: mongodb://admin:password@localhost:27017/app-test?authSource=admin
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-with-at-least-32-characters
          JWT_REFRESH_SECRET: test-refresh-secret-with-at-least-32-characters
      - run: pnpm test:e2e
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://admin:password@localhost:27017/app-test?authSource=admin
          TEST_MONGODB_URI: mongodb://admin:password@localhost:27017/app-test?authSource=admin
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-with-at-least-32-characters
          JWT_REFRESH_SECRET: test-refresh-secret-with-at-least-32-characters

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
