services:
  nginx:
    image: nginx:alpine
    container_name: monorepo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - app-network

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: monorepo-web
    networks:
      - app-network

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: monorepo-api
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      TENANCY_MODE: ${TENANCY_MODE:-single}
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-10}
      MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE:-2}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-5000}
      MONGODB_HEARTBEAT_FREQUENCY_MS: ${MONGODB_HEARTBEAT_FREQUENCY_MS:-10000}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      CLIENT_URL: ${CLIENT_URL:?set CLIENT_URL}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY_ID: ${MINIO_USER:?set MINIO_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
      S3_REGION: ${S3_REGION:-us-east-1}
      CDN_ENABLED: ${CDN_ENABLED:-false}
      CDN_DOMAIN: ${CDN_DOMAIN:-}
      CDN_BUCKET_PATH: ${CDN_BUCKET_PATH:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command:
      - node
      - scripts/run-migrations.js
      - up
      - -f
      - migrations/migrate-mongo-config.ts
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  mongodb:
    image: mongo:7
    container_name: monorepo-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-app}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)"'
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: monorepo-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: monorepo-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  minio-init:
    image: minio/minio:latest
    entrypoint: /bin/sh
    command:
      - -c
      - mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing local/${S3_BUCKET:-uploads}
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mongodb_data:
  redis_data:
  minio_data:

networks:
  app-network:
    driver: bridge
