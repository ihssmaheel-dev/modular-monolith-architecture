services:
  nginx:
    image: nginx:1.27-alpine
    container_name: monorepo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL}
    container_name: monorepo-web
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: monorepo-api
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PROCESS_ROLE: api
      TENANCY_MODE: ${TENANCY_MODE:-single}
      PORT: 3000
      TRUST_PROXY: "true"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      CLIENT_URL: ${CLIENT_URL:?set CLIENT_URL}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY_ID: ${MINIO_USER:?set MINIO_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
      FILE_USER_QUOTA_BYTES: ${FILE_USER_QUOTA_BYTES:-104857600}
      FILE_AV_ENABLED: ${FILE_AV_ENABLED:-false}
      FILE_AV_URL: ${FILE_AV_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      CDN_ENABLED: ${CDN_ENABLED:-false}
      CDN_DOMAIN: ${CDN_DOMAIN:-}
      CDN_BUCKET_PATH: ${CDN_BUCKET_PATH:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: monorepo-worker
    command: ["node", "apps/api/dist/apps/api/src/main.js"]
    environment:
      NODE_ENV: production
      PROCESS_ROLE: worker
      TENANCY_MODE: ${TENANCY_MODE:-single}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      CLIENT_URL: ${CLIENT_URL:?set CLIENT_URL}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY_ID: ${MINIO_USER:?set MINIO_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
      S3_REGION: ${S3_REGION:-us-east-1}
      FILE_USER_QUOTA_BYTES: ${FILE_USER_QUOTA_BYTES:-104857600}
      FILE_AV_ENABLED: ${FILE_AV_ENABLED:-false}
      FILE_AV_URL: ${FILE_AV_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - app-network

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["pnpm", "--filter", "api", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: monorepo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: monorepo-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: monorepo-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  minio-init:
    image: minio/mc:RELEASE.2024-06-13T19-44-45Z
    entrypoint: /bin/sh
    command:
      - -c
      - mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing local/${S3_BUCKET:-uploads}
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  app-network:
    driver: bridge
